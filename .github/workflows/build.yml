name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        DISTRO: [
          { "ubuntu": "jammy", "file": "ubuntu" },
          { "ubuntu": "jammy", "file": "ubuntu_llvm" },
          { "ubuntu": "noble", "file": "ubuntu" },
          { "ubuntu": "noble", "file": "ubuntu_llvm" },
          { "ubuntu": "resolute", "file": "ubuntu" },
          { "ubuntu": "resolute", "file": "ubuntu_llvm" }
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker login
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: ${{github.workspace}}/docker/${{ matrix.DISTRO.file }}/Dockerfile
          build-args: |
            BASE_IMAGE=ubuntu:${{ matrix.DISTRO.ubuntu }}
          context: .
          push: false

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          pip install . -v
