[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pyridescence"
dynamic = ["version"]
description = "3D visualization library for rapid prototyping of 3D algorithms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenji Koide", email = "k.koide@aist.go.jp" }]
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.16"
# Install only the python component (pyridescence/ package). C++ headers, libs, and cmake configs are excluded.
install.components = ["python"]
# Python sources are installed by CMake (see CMakeLists.txt)
wheel.packages = []
sdist.exclude = ["/.venv", "/build", "/site", "/dist", "/docker", "/*.egg-info", "*.whl", "/imgui.ini"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(iridescence VERSION (?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = true
BUILD_SHARED_LIBS = false

[tool.cibuildwheel.linux]
before-all = "yum install -y libpng-devel libjpeg-turbo-devel wayland-devel mesa-libGL-devel libX11-devel libXcursor-devel libXinerama-devel libXrandr-devel libXi-devel libxkbcommon-devel"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build = "*"
skip = "pp* *-win32 *_i686 *musllinux*" # Don't build for PyPy, Win32, i686
